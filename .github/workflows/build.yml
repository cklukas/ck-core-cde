name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'ckdocs.yml'
      - 'scripts/build-docs.sh'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          path: cde-source
      - name: Read the batch Motif revision
        id: motif
        shell: bash
        run: |
          set -eu
          revision="$(cat cde-source/.ckgit/motif-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the batch CK Core Motif revision
        uses: actions/checkout@v5
        with:
          repository: cklukas/ck-core-motif
          ref: ${{ steps.motif.outputs.revision }}
          path: motif-source
          persist-credentials: false
      - name: Read the filesystem consumer revision
        id: filesystem
        shell: bash
        run: |
          set -eu
          revision="$(cat cde-source/.ckgit/fs-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the filesystem consumer revision
        uses: actions/checkout@v5
        with:
          repository: cklukas/ck-core-fs-lib
          ref: ${{ steps.filesystem.outputs.revision }}
          path: fs-source
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential cmake fakeroot flex ksh libatspi2.0-dev \
            libdbus-1-dev libharfbuzz-dev libicu-dev libjpeg-dev liblmdb-dev libpam0g-dev libpng-dev \
            librsvg2-dev libssl-dev libtirpc-dev libtool libutempter-dev libxaw7-dev \
            libxft-dev libxinerama-dev libxmu-dev libxpm-dev libxrender-dev libxss-dev \
            m4 ncompress opensp pkg-config python3 rpcsvc-proto tcl-dev x11-xserver-utils \
            xauth xbitmaps xfonts-utils xvfb
      - name: Build CK Core Motif ABI 9
        run: |
          set -eu
          motif_revision="$(git -C motif-source rev-parse HEAD)"
          echo "CK Core Motif revision: $motif_revision"
          echo "CK Core Motif revision: \`$motif_revision\`" >> "$GITHUB_STEP_SUMMARY"
          prefix="$RUNNER_TEMP/motif"
          mkdir "$RUNNER_TEMP/motif-build"
          (cd motif-source && autoreconf -fi)
          cd "$RUNNER_TEMP/motif-build"
          "$GITHUB_WORKSPACE/motif-source/configure" --prefix="$prefix" \
            --disable-demos --disable-static --enable-xft --enable-unicode-text \
            --enable-atspi --enable-svg CFLAGS='-O1 -g0' CXXFLAGS='-O1 -g0'
          for component in bindings bitmaps config localized lib include tools/wml clients/uil; do
            make -j4 -C "$component"
            make -j1 -C "$component" install
          done
          test -e "$prefix/lib/libXm.so.9"
          test -x "$prefix/bin/uil"
      - name: Build and test CDE
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/cde-tests"
          export TMPDIR="$RUNNER_TEMP/cde-tests"
          xinerama_probe="$RUNNER_TEMP/cde-xinerama-probe"
          printf '%s\n' \
            'char XineramaQueryScreens(void);' \
            'int main(void) { return XineramaQueryScreens(); }' \
            > "$xinerama_probe.c"
          cc "$xinerama_probe.c" -lXinerama -o "$xinerama_probe"
          prefix="$RUNNER_TEMP/motif"
          export PATH="$prefix/bin:$PATH"
          export CPPFLAGS="-I$prefix/include $(pkg-config --cflags xft)"
          export LDFLAGS="-L$prefix/lib -Wl,-rpath,$prefix/lib"
          export LD_LIBRARY_PATH="$prefix/lib"
          cd cde-source/cde
          ./autogen.sh
          if ! ./configure CFLAGS='-O1 -g0' CXXFLAGS='-O1 -g0'; then
            tail -n 200 config.log
            exit 1
          fi
          make -j4
          make -j4 check
          readelf -dW programs/dtwm/.libs/dtwm | grep -F 'libXm.so.9'
      - name: Build installed filesystem C API and test dtfile workflows
        run: |
          set -eu
          export TMPDIR="$RUNNER_TEMP/cde-tests"
          fs_prefix="$RUNNER_TEMP/filesystem"
          private_fixture="$(mktemp -d "$HOME/.cde-sync-test.XXXXXXXX")"
          trap 'rm -rf "$private_fixture"' EXIT
          export DTFILE_PRIVATE_TEST_ROOT="$private_fixture"
          cmake -S fs-source -B "$RUNNER_TEMP/filesystem-build" \
            -DCMAKE_INSTALL_PREFIX="$fs_prefix" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCK_CORE_FS_BUILD_BROWSER=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_FLAGS='-O1 -g0'
          cmake --build "$RUNNER_TEMP/filesystem-build" --parallel 4
          cmake --install "$RUNNER_TEMP/filesystem-build"
          prefix="$RUNNER_TEMP/motif"
          export PATH="$prefix/bin:$PATH"
          export CPPFLAGS="-I$prefix/include $(pkg-config --cflags xft)"
          export LDFLAGS="-L$prefix/lib -Wl,-rpath,$prefix/lib"
          export LD_LIBRARY_PATH="$prefix/lib:$fs_prefix/lib"
          export PKG_CONFIG_PATH="$fs_prefix/lib/pkgconfig"
          cd cde-source/cde
          ./configure --with-ck-core-fs CFLAGS='-O1 -g0' CXXFLAGS='-O1 -g0'
          make -j4 -C programs/dtfile
          make -j1 -C programs/localized/C/msg dtfile_sync.cat
          make -j1 -C programs/dtfile check
          xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            python3 programs/dtfile/tests/check-sync-retry-ui.py \
              --fs-prefix "$fs_prefix" --motif-prefix "$prefix" \
              --work-dir "$private_fixture/retry-ui"
