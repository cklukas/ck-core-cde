version: 1
on:
  branches: [master]
sisters:
  - name: ck-git-hosting
    # ckdocs v0.10.1
    ref: 7e3ee5eb57a2cef2e07f9e9fe5c4e2822502d322
  - name: ck-core-motif
    ref: fd5f4a74b6c771b7948f38b7eca3f800d0f3b5cd
  - name: ck-core-fs-lib
    ref: 39725163e43530b9ae35e9fed55f4fedb4d759b6
jobs:
  - name: documentation
    steps:
      - name: documentation-site
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          test -n "$TMPDIR"
          test -n "$CKGIT_SISTER_CK_GIT_HOSTING"
          run_id="$(git rev-parse HEAD)"
          rm -rf "$TMPDIR/cde-docs-$run_id" public
          scripts/build-docs.sh "$CKGIT_SISTER_CK_GIT_HOSTING" \
            "$TMPDIR/cde-docs-$run_id" "$PWD/public" \
            http://rpi4:8421/ck-core-cde/
          mkdir -p docs-evidence
          cp "$TMPDIR/cde-docs-$run_id/receipt.txt" docs-evidence/receipt.txt
    artifacts:
      name: documentation-evidence
      paths: [docs-evidence]
  - name: build-gcc-c23
    steps:
      - name: build-and-test-gcc-c23
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          scripts/run-rpi4-c23-lane.sh gcc-14 g++-14 gcc14
  - name: build-clang-c23
    steps:
      - name: build-and-test-clang-c23
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          scripts/run-rpi4-c23-lane.sh clang-19 clang++-19 clang19
pages:
  path: public
