version: 1
runs_on: primary
on:
  branches: [master]
sisters:
  - name: ck-git-hosting
    # ckdocs v0.11.0
    ref: fbe21b49d6c5d5afebffa3d3de745351e07c6b5e
  - name: ck-core-motif
    ref: b1c6fa1e08356336d7cee9282db972a87e664f5e
  - name: ck-core-fs-lib
    ref: edd7db6a2bcbf3ea15cfc0d32be31ddc837321e8
jobs:
  - name: documentation
    steps:
      - name: documentation-site
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          test -n "$TMPDIR"
          test -n "$CKGIT_SISTER_CK_GIT_HOSTING"
          run_id="$(git rev-parse HEAD)"
          rm -rf "$TMPDIR/cde-docs-$run_id" public
          scripts/build-docs.sh "$CKGIT_SISTER_CK_GIT_HOSTING" \
            "$TMPDIR/cde-docs-$run_id" "$PWD/public" \
            http://rpi4:8421/ck-core-cde/
          mkdir -p docs-evidence
          cp "$TMPDIR/cde-docs-$run_id/receipt.txt" docs-evidence/receipt.txt
    artifacts:
      name: documentation-evidence
      paths: [docs-evidence]
  - name: build-gcc-c23
    steps:
      - name: build-and-test-gcc-c23
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          scripts/run-rpi4-c23-lane.sh gcc-14 g++-14 gcc14
  - name: build-clang-c23
    steps:
      - name: build-and-test-clang-c23
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          scripts/run-rpi4-c23-lane.sh clang-19 clang++-19 clang19
  - name: fuzz-replay
    steps:
      - name: replay-fuzz-corpora
        script: |
          export GIT_CONFIG_NOSYSTEM=1
          test -n "$TMPDIR"
          run_id="$(git rev-parse HEAD)"
          CLANG=clang-19 python3 cde/fuzz/run-fuzz.py --all --replay \
            --scratch "$TMPDIR/cde-fuzz-replay-$run_id"
pages:
  path: public
