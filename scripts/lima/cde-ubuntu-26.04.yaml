# Lima ARM64 Ubuntu 26.04 LTS qualification VM for CK Core CDE & Wayland.
#
# Always launch with LIMA_HOME and XDG_CACHE_HOME set beneath /Volumes/S8T/tmp
# (or /Volumes/PRO-BLADE/tmp if /Volumes/S8T is unavailable), e.g.:
#   export TASK_ROOT=/Volumes/S8T/tmp/cde-wayland-<task>
#   export TMPDIR=$TASK_ROOT/tmp
#   export LIMA_HOME=$TASK_ROOT/lima
#   export XDG_CACHE_HOME=$TASK_ROOT/cache
#   limactl start --tty=false --name=cde-ubuntu2604 scripts/lima/cde-ubuntu-26.04.yaml

minimumLimaVersion: 2.0.0

base:
- template:_images/ubuntu-26.04

vmType: vz
os: Linux
arch: aarch64
cpus: 6
memory: "6GiB"
disk: "60GiB"
mountType: virtiofs

containerd:
  system: false
  user: false

mounts:
- location: "/Volumes/PRO-BLADE/git"
  mountPoint: "/Volumes/PRO-BLADE/git"
  writable: false
- location: "/Volumes/S8T/tmp"
  mountPoint: "/Volumes/S8T/tmp"
  writable: true

audio:
  device: "vz"

video:
  display: "none"

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y --no-install-recommends \
      build-essential clang libclang-rt-dev lld llvm cmake ninja-build meson pkg-config \
      autoconf automake libtool bison byacc flex m4 gawk gettext locales \
      python3 python3-pil git curl ca-certificates file binutils patchelf fakeroot \
      dpkg-dev gnupg lintian \
      libx11-dev libxt-dev libxext-dev libxmu-dev libxpm-dev libxau-dev \
      libxdmcp-dev libxinerama-dev libxrandr-dev libxrender-dev libxcursor-dev \
      libxfixes-dev libxss-dev libxaw7-dev libxft-dev libice-dev libsm-dev \
      libfontconfig1-dev libfreetype-dev libharfbuzz-dev libicu-dev \
      librsvg2-dev libdbus-1-dev libjpeg-dev libpng-dev liblmdb-dev \
      libtirpc-dev libpam0g-dev libutempter-dev tcl-dev ksh93u+m \
      x11-xserver-utils x11-utils xfonts-utils xfonts-base xfonts-100dpi xbitmaps \
      ncompress opensp rpcsvc-proto rpcbind ncurses-bin xvfb \
      libcairo2-dev libasound2-dev libpulse-dev libfluidsynth-dev libcurl4-openssl-dev \
      libwayland-dev libwayland-bin wayland-protocols libwlroots-0.19-dev \
      xwayland libseat-dev libinput-dev libxkbcommon-dev libdrm-dev \
      libgbm-dev libegl-dev libgles-dev libpixman-1-dev \
      dbus-x11 libnotify-bin wlr-randr pipewire pipewire-pulse pipewire-alsa wireplumber rtkit alsa-utils pulseaudio-utils xdg-desktop-portal xdg-desktop-portal-wlr \
      fonts-noto-cjk labwc grim wlrctl wayvnc foot
    # Ensure hostname resolves via IPv4 loopback so ToolTalk (libtt / ttsession)
    # TI-RPC loopback binds cleanly instead of hitting nss-myhostname link-local IPv6.
    if ! grep -Eq "^[[:space:]]*127\\.0\\.1\\.1[[:space:]]+$(hostname)(\$|[[:space:]])" /etc/hosts; then
      sed -i "1a 127.0.1.1\t$(hostname)" /etc/hosts
    fi
    # Enable rpcbind and install the CDE Calendar Manager service unit (rpc-cmsd.service)
    # so dtcm works out of the box both for source installs and ck-core-cde .deb installs.
    mkdir -p /var/spool/calendar
    chown daemon:daemon /var/spool/calendar
    chmod 1777 /var/spool/calendar
    cat > /lib/systemd/system/rpc-cmsd.service <<'CMSDEOF'
    [Unit]
    Description=CK Core CDE Calendar Manager Service Daemon (rpc.cmsd)
    Documentation=man:rpc.cmsd(1)
    After=local-fs.target
    ConditionPathExists=/usr/dt/bin/rpc.cmsd

    [Service]
    Type=simple
    RuntimeDirectory=rpc.cmsd
    RuntimeDirectoryMode=0755
    ExecStart=/usr/dt/bin/rpc.cmsd -s -u
    KillSignal=SIGHUP
    Restart=on-failure
    RestartSec=2
    PrivateNetwork=yes
    RestrictAddressFamilies=AF_UNIX
    NoNewPrivileges=yes
    ProtectHome=read-only

    [Install]
    WantedBy=multi-user.target
    CMSDEOF
    systemctl daemon-reload
    systemctl enable --now rpcbind.service || true
    systemctl enable rpc-cmsd.service || true
    if [ -x /usr/dt/bin/rpc.cmsd ]; then
      systemctl restart rpc-cmsd.service || true
    fi
    # Configure WirePlumber for virtio_snd on Apple Virtualization.framework (vz),
    # where cpu.vm.name is unset so stock alsa-vm.conf misses virtio_snd and
    # leaves mmap=true / period-size=120 / headroom=0 (causing virtqueue stalls).
    mkdir -p /etc/pipewire/pipewire.conf.d /etc/wireplumber/wireplumber.conf.d
    cat > /etc/pipewire/pipewire.conf.d/50-vm-quantum.conf <<'PWEOF'
    context.properties = {
        default.clock.rate          = 48000
        default.clock.quantum       = 2048
        default.clock.min-quantum   = 1024
        default.clock.max-quantum   = 8192
    }
    PWEOF
    cat > /etc/wireplumber/wireplumber.conf.d/50-virtio-snd.conf <<'WPEOF'
    monitor.alsa.rules = [
      {
        matches = [ { alsa.driver_name = "virtio_snd" } ]
        actions = {
          update-props = {
            api.alsa.disable-mmap           = true
            api.alsa.disable-batch          = true
            api.alsa.period-size            = 2048
            api.alsa.period-num             = 8
            api.alsa.headroom               = 4096
            session.suspend-timeout-seconds = 0
          }
        }
      }
    ]
    WPEOF
